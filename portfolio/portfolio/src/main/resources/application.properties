spring.application.name=portfolio

server.port=${PORT:8080}

# Render Secret File mounted at this path supplies spring.mail.password.
spring.config.import=optional:file:/etc/secrets/mail-secrets.properties,optional:file:./mail-secrets.properties,optional:file:./portfolio/portfolio/mail-secrets.properties

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mahanushya3001@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
